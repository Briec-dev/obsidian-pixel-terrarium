name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version tag (must match manifest.json version, e.g., 1.0.0 without 'v')"
        required: true
        default: "1.0.0"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Verify manifest.json and versions.json match tag
        run: |
          node -e '
            const fs = require("node:fs");
            const tag = process.env.TAG_NAME;
            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
            if (!tag) throw new Error("Missing TAG_NAME");
            if (manifest.version !== tag) {
              throw new Error(`manifest.json version (${manifest.version}) does not match tag (${tag})`);
            }
            if (!Object.prototype.hasOwnProperty.call(versions, tag)) {
              throw new Error(`versions.json is missing entry for ${tag}`);
            }
          '

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub Release with Obsidian Plugin Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
